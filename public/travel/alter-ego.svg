<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="photoSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#photoSky)"/>
  <!-- Mist layers -->
  <ellipse cx="300" cy="280" rx="350" ry="80" fill="#e0e7ff" opacity="0.35"/>
  <ellipse cx="200" cy="330" rx="280" ry="60" fill="#e0e7ff" opacity="0.45"/>
  <!-- Pine trees background -->
  <polygon points="80,360 110,240 140,360" fill="#1e1b4b" opacity="0.7"/>
  <polygon points="120,380 150,260 180,380" fill="#1e1b4b" opacity="0.6"/>
  <polygon points="460,370 490,230 520,370" fill="#1e1b4b" opacity="0.7"/>
  <polygon points="500,390 530,270 560,390" fill="#1e1b4b" opacity="0.6"/>
  <!-- Photographer Silhouette holding Camera -->
  <g transform="translate(250, 160)">
    <ellipse cx="50" cy="35" r="28" fill="#0f172a"/>
    <!-- Head beanie -->
    <path d="M 22,35 C 22,12 78,12 78,35 Z" fill="#4338ca"/>
    <!-- Torso Jacket -->
    <path d="M 10,70 L 90,70 L 105,250 L -5,250 Z" fill="#09090b"/>
    <!-- Raised Hands & DSLR Camera -->
    <rect x="25" y="45" width="55" height="38" rx="6" fill="#18181b" stroke="#71717a" stroke-width="2"/>
    <!-- Camera Lens Cylinder -->
    <circle cx="52" cy="64" r="14" fill="#09090b" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="52" cy="64" r="7" fill="#38bdf8" opacity="0.6"/>
    <!-- Hands holding camera body -->
    <path d="M 10,85 Q 22,60 26,55" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 90,85 Q 78,60 76,55" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Red Camera Strap -->
    <path d="M 24,55 C 10,130 90,130 78,55" fill="none" stroke="#ef4444" stroke-width="4"/>
  </g>
</svg>
