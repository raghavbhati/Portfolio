<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="chaiBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#chaiBg)"/>
  <!-- Mountain Silhouette in Background -->
  <polygon points="0,320 180,180 340,320" fill="#64748b" opacity="0.4"/>
  <polygon points="260,320 440,160 600,320" fill="#64748b" opacity="0.4"/>
  <!-- Wooden Table/Bench surface -->
  <path d="M 0,330 L 600,310 L 600,450 L 0,450 Z" fill="#3e2723"/>
  <line x1="0" y1="360" x2="600" y2="340" stroke="#271612" stroke-width="3"/>
  <!-- Hands holding 4 glasses of chai together -->
  <g transform="translate(180, 200)">
    <!-- Cup 1 Left -->
    <rect x="30" y="70" width="36" height="50" rx="3" fill="#f8fafc" opacity="0.85" stroke="#cbd5e1"/>
    <rect x="33" y="76" width="30" height="40" rx="2" fill="url(#teaGrad)"/>
    <!-- Steam -->
    <path d="M 45,65 Q 40,50 48,40" stroke="#f8fafc" stroke-width="2" fill="none" opacity="0.7"/>
    <!-- Cup 2 Center-Left -->
    <rect x="90" y="55" width="36" height="50" rx="3" fill="#f8fafc" opacity="0.85" stroke="#cbd5e1"/>
    <rect x="93" y="61" width="30" height="40" rx="2" fill="url(#teaGrad)"/>
    <path d="M 105,50 Q 112,35 106,25" stroke="#f8fafc" stroke-width="2" fill="none" opacity="0.7"/>
    <!-- Cup 3 Center-Right -->
    <rect x="150" y="55" width="36" height="50" rx="3" fill="#f8fafc" opacity="0.85" stroke="#cbd5e1"/>
    <rect x="153" y="61" width="30" height="40" rx="2" fill="url(#teaGrad)"/>
    <path d="M 165,50 Q 158,35 166,25" stroke="#f8fafc" stroke-width="2" fill="none" opacity="0.7"/>
    <!-- Cup 4 Right -->
    <rect x="210" y="70" width="36" height="50" rx="3" fill="#f8fafc" opacity="0.85" stroke="#cbd5e1"/>
    <rect x="213" y="76" width="30" height="40" rx="2" fill="url(#teaGrad)"/>
    <path d="M 225,65 Q 232,50 226,40" stroke="#f8fafc" stroke-width="2" fill="none" opacity="0.7"/>
    <!-- Hands holding cups -->
    <path d="M 0,110 Q 30,100 35,90" stroke="#d97706" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 280,110 Q 250,100 245,90" stroke="#d97706" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 100,160 Q 105,120 108,105" stroke="#b45309" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 175,160 Q 170,120 168,105" stroke="#b45309" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>
</svg>
