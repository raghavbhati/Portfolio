<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="restStopBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Rest stop tiled wall -->
  <rect width="600" height="450" fill="url(#restStopBg)"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#475569" stroke-width="2"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#475569" stroke-width="2"/>
  <line x1="0" y1="225" x2="600" y2="225" stroke="#475569" stroke-width="2"/>
  <!-- Mirror Frame -->
  <rect x="150" y="40" width="300" height="370" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="6"/>
  <!-- Mirror Glass Reflection -->
  <rect x="165" y="55" width="270" height="340" rx="8" fill="#1e293b"/>
  <!-- Mirror Selfie Silhouette: holding camera right in front of face ("Spiderman" sticker / lens) -->
  <g transform="translate(300, 230)">
    <!-- Head / Hair -->
    <ellipse cx="0" cy="-60" rx="42" ry="48" fill="#09090b"/>
    <!-- Sunglasses / Camera held right in front of face -->
    <rect x="-45" y="-55" width="90" height="60" rx="8" fill="#111827" stroke="#dc2626" stroke-width="3"/>
    <!-- Circular Red Spider Web Lens Decal in Center -->
    <circle cx="0" cy="-25" r="22" fill="#991b1b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="-25" r="12" fill="#000000"/>
    <circle cx="0" cy="-25" r="4" fill="#ffffff"/>
    <!-- Two Hands holding phone/camera -->
    <rect x="-65" y="-45" width="18" height="35" rx="5" fill="#f59e0b"/>
    <rect x="47" y="-45" width="18" height="35" rx="5" fill="#f59e0b"/>
    <!-- Jacket shoulders -->
    <path d="M -90,40 C -70,0 -30,0 0,10 C 30,0 70,0 90,40 L 90,140 L -90,140 Z" fill="#09090b"/>
    <!-- Flash sparkle -->
    <polygon points="-30,-45 -25,-40 -20,-45 -25,-50" fill="#ffffff"/>
  </g>
</svg>
