<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="forestSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Forest Canopy -->
  <rect width="600" height="450" fill="url(#forestSky)"/>
  <!-- Tall Pine Tree Trunks -->
  <rect x="60" y="0" width="35" height="450" fill="#3f2e1a"/>
  <rect x="130" y="0" width="28" height="450" fill="#2d2012"/>
  <rect x="420" y="0" width="32" height="450" fill="#2d2012"/>
  <rect x="490" y="0" width="40" height="450" fill="#3f2e1a"/>
  <!-- Lush Green Pine Foliage -->
  <circle cx="80" cy="80" r="100" fill="#14532d" opacity="0.9"/>
  <circle cx="200" cy="60" r="120" fill="#166534" opacity="0.85"/>
  <circle cx="450" cy="70" r="130" fill="#14532d" opacity="0.9"/>
  <!-- God Rays -->
  <polygon points="260,0 340,0 480,450 180,450" fill="#fef08a" opacity="0.2"/>
  <!-- Winding Forest Asphalt Road -->
  <path d="M 270,160 Q 290,240 220,320 T 150,450 L 450,450 Q 380,320 310,240 T 300,160 Z" fill="url(#roadGrad)"/>
  <!-- Road White Dash Line -->
  <path d="M 285,160 Q 300,240 260,320 T 300,450" stroke="#f8fafc" stroke-width="4" stroke-dasharray="14 12" fill="none"/>
  <!-- Cyclist riding with arms wide open -->
  <g transform="translate(280, 240) scale(0.7)">
    <circle cx="20" cy="15" r="10" fill="#0f172a"/>
    <!-- Torso White Tee -->
    <path d="M 12,25 L 28,25 L 32,55 L 8,55 Z" fill="#f8fafc"/>
    <!-- Arms wide open! -->
    <path d="M -25,28 L 20,30 L 65,28" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Hands -->
    <circle cx="-27" cy="28" r="4" fill="#f59e0b"/>
    <circle cx="67" cy="28" r="4" fill="#f59e0b"/>
    <!-- Bicycle Wheels and Frame -->
    <circle cx="20" cy="80" r="18" fill="none" stroke="#0f172a" stroke-width="4"/>
    <line x1="20" y1="55" x2="20" y2="80" stroke="#0f172a" stroke-width="4"/>
  </g>
</svg>
