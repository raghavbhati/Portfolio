<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="mirrorGlass" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="90%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
  </defs>
  <!-- White Mountain Cottage Wall / Sky -->
  <rect width="600" height="450" fill="url(#wallBg)"/>
  <!-- Overhanging tin roof & cedar branch -->
  <path d="M 0,0 L 600,0 L 600,80 L 0,110 Z" fill="#475569"/>
  <path d="M 120,40 Q 200,80 320,60" stroke="#15803d" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Convex Road Safety Mirror -->
  <g transform="translate(320, 260)">
    <!-- Metal Support Bracket -->
    <rect x="-8" y="110" width="16" height="90" fill="#64748b"/>
    <!-- Red Outer Casing Rim -->
    <circle cx="0" cy="0" r="140" fill="#dc2626" stroke="#991b1b" stroke-width="4"/>
    <!-- Convex Glass Surface with Fisheye Distortion -->
    <circle cx="0" cy="0" r="124" fill="url(#mirrorGlass)"/>
    <!-- Fisheye Scene Inside Mirror -->
    <!-- Fisheye Mountain Road & Sky -->
    <ellipse cx="0" cy="-20" rx="100" ry="60" fill="#bae6fd"/>
    <path d="M -90,40 Q 0,-30 90,30 L 90,110 L -90,110 Z" fill="#334155"/>
    <path d="M -40,110 Q 0,40 40,110 Z" fill="#e2e8f0"/>
    <!-- Fisheye Rider Silhouette in center of mirror -->
    <circle cx="0" cy="30" r="18" fill="#0f172a"/>
    <path d="M -15,50 L 15,50 L 22,95 L -22,95 Z" fill="#0f172a"/>
    <!-- Glass Highlight Reflection Arc -->
    <path d="M -80,-60 A 100 100 0 0 1 60,-80" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
