<!doctype html>
<!--
  The link-preview image (public/og.png, 1200×630). Rendered with `npm run og:image`,
  which screenshots this page in headless Chrome. Mirrors the site: black page, pinboard
  dots, dashed column, Instrument Serif name, one rose string.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #000;
        color: #b0b0b0;
        font-family: 'DM Sans', Arial, sans-serif;
      }
      body {
        background-image: radial-gradient(circle, #262626 1px, transparent 1.4px);
        background-size: 24px 24px;
      }
      .column {
        position: absolute;
        inset: 0 180px;
        background: #000;
        border-left: 1px dashed #262626;
        border-right: 1px dashed #262626;
        padding: 92px 72px 0;
      }
      .monogram {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 1px solid #444;
        background: radial-gradient(circle at 30% 20%, #515151, #101010 75%);
        font: italic 30px 'Instrument Serif', Georgia, serif;
        color: #ddd;
      }
      h1 {
        margin-top: 40px;
        font: 400 104px/1 'Instrument Serif', Georgia, serif;
        letter-spacing: -2px;
        color: #ededed;
      }
      .roles {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 18px;
        font-size: 30px;
        color: #929292;
      }
      .roles i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #454545;
      }
      .stack {
        margin-top: 34px;
        font-size: 22px;
        color: #b0b0b0;
      }
      .url {
        position: absolute;
        left: 72px;
        bottom: 56px;
        font: 20px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #929292;
      }
      svg {
        position: absolute;
        right: 40px;
        bottom: 36px;
      }
    </style>
  </head>
  <body>
    <div class="column">
      <div class="monogram">RB</div>
      <h1>Raghav Bhati</h1>
      <p class="roles">
        <span>frontend</span><i></i><span>backend</span><i></i><span>distributed systems</span>
      </p>
      <p class="stack">Backend systems · Node.js · TypeScript · GraphQL · Kafka</p>
      <p class="url">raghavbhatirv.in</p>
      <svg width="300" height="120" viewBox="0 0 300 120" aria-hidden="true">
        <path
          d="M 10 40 C 90 96, 170 96, 290 30"
          fill="none"
          stroke="#fb6474"
          stroke-opacity="0.7"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <circle cx="10" cy="40" r="4" fill="#ededed" />
        <circle cx="135" cy="81" r="4" fill="#ededed" />
        <circle cx="290" cy="30" r="4" fill="#ededed" />
      </svg>
    </div>
  </body>
</html>
